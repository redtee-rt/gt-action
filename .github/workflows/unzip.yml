name: Unzip 1.zip to themes/stack

on:
  # 每次 push 到 main 分支时触发
  push:
    branches:
      - main
    # 监控根目录下的1.zip文件变化
    paths:
      - '1.zip'

jobs:
  unzip-theme:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出当前仓库的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 解压1.zip包到 themes/stack 目录
      - name: Unzip 1.zip to themes/stack
        run: |
          mkdir -p themes/stack  # 确保目标目录存在
          unzip -o 1.zip -d themes/stack  # 解压文件到 themes/stack
